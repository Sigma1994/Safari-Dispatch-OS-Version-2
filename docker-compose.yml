services:
  postgres:
    image: postgres:16-alpine
    container_name: safari-dispatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-safari_dispatch}
      POSTGRES_USER: ${PGUSER:-safari}
      POSTGRES_PASSWORD: ${PGPASSWORD:-safari_dev}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - safari_pg_data:/var/lib/postgresql/data
      - ./data/postgres_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/postgres_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-safari} -d ${PGDATABASE:-safari_dispatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: start Ollama via Docker if not running Ollama Desktop natively
  ollama:
    image: ollama/ollama:latest
    container_name: safari-dispatch-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - safari_ollama_data:/root/.ollama

volumes:
  safari_pg_data:
  safari_ollama_data:
